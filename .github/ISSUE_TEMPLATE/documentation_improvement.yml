name: Documentation Improvement
description: Report or propose a change to the documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation. Please link the page or
        file you are referring to.
  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation type
      description: What kind of documentation does this concern?
      options:
        - README
        - RUN_GUIDE.md
        - DEVELOPER_GUIDE.md
        - CHANGELOG
        - CONTRIBUTING
        - docs/ folder
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: Link or path to the documentation that should change.
      placeholder: e.g. README.md, section "Installation"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
      description: Explain the inaccuracy, gap, or confusing part.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: What should it say instead, or what should be added?
    validations:
      required: true
  - type: checkboxes
    id: implementation
    attributes:
      label: Contribution
      options:
        - label: I can open a pull request to fix this
