name: Bug Report
description: Report a problem with the Lead Generation Agent
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before opening, please check
        the [existing issues](https://github.com/Samay-Chhabria/Lead_Generation_Agent/issues)
        and the [Troubleshooting section](https://github.com/Samay-Chhabria/Lead_Generation_Agent#troubleshooting)
        of the README.
  - type: textarea
    id: describe
    attributes:
      label: Bug description
      description: What happened, and what did you expect to happen instead?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the bug.
      placeholder: |
        1. Set up the project as described in the README.
        2. Run `python app/main.py` and type `software companies in Karachi`.
        3. ...
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or a traceback.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output (optional)
      description: Paste relevant lines from `logs/application.log`, if any.
      render: text
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Select the operating system you were using.
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: e.g. 3.12.5
  - type: textarea
    id: config
    attributes:
      label: Configuration (optional)
      description: Non-secret values from your `.env` (never paste secrets).
      render: text
